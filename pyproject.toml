[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churnlib"
version = "0.1.0"
description = "A small toolkit for customer churn modelling"
authors = [
    { name = "Navdeep Gill", email = "mr.navdeepgill@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "scikit-learn>=1.4",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["churnlib*"]
